name: Preise prüfen
on:
  push:
    paths: ["produkte/**", "preise.py", "werkzeug/**"]
  schedule:
    - cron: "7 6-22 * * *"   # stündlich 7:07–23:07 Uhr deutscher Winterzeit (Sommerzeit: 8:07–0:07)
  workflow_dispatch:
    inputs:
      debug:
        description: "Rohseiten zum Analysieren speichern"
        required: false
        default: "nein"
permissions:
  contents: write
  issues: write
concurrency:
  group: preise
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: lauf
        run: python preise.py
        env:
          DEBUG_HTML: ${{ github.event.inputs.debug == 'ja' && '1' || '' }}
      - name: iPhone prüfen
        run: python preise.py produkte/iphone-17-pro.json
        env:
          DEBUG_HTML: ${{ github.event.inputs.debug == 'ja' && '1' || '' }}
        continue-on-error: true
      - name: KICKR CORE 2 prüfen
        run: python preise.py produkte/kickr-core-2.json
        env:
          DEBUG_HTML: ${{ github.event.inputs.debug == 'ja' && '1' || '' }}
        continue-on-error: true
      - name: Webseite bauen (docs/ für GitHub Pages)
        run: |
          mkdir -p docs/daten && python werkzeug/export_dashboard.py data/prices.json docs/daten
          python werkzeug/seite_bauen.py docs/daten docs/index.html
        continue-on-error: true
      - name: Ergebnis speichern
        run: |
          git config user.name "preisradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json übersicht.md data/prices-iphone-17-pro.json übersicht-iphone-17-pro.md data/prices-kickr-core-2.json übersicht-kickr-core-2.md
          [ -d debug ] && git add -f debug || true
          [ -d docs ] && git add docs || true
          git commit -m "Preise: Lauf $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')" || exit 0
          git pull --rebase
          git push
      - name: Melden (GitHub-Benachrichtigung)
        if: steps.lauf.outputs.melden == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "🔔 MacBook Air M5 für ${{ steps.lauf.outputs.preis }} €" \
            --body "Neuer Tiefstwert oder Preis ≤ Zielpreis. Übersicht: ${{ github.server_url }}/${{ github.repository }}/blob/main/übersicht.md"
